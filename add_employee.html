{% extends "base.html" %}
{% block title %}VVITU Add Employee{% endblock %}
{% block page_title %}Add VVITU Employee{% endblock %}

{% block content %}
<div class="frost-panel">
    <div class="panel-top">
        <h3>VVITU Employee & Monthly Salary Form</h3>
    </div>
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>VVITU Employee ID *</label>
                <input type="text" name="emp_code" value="{{ suggested_code }}" required>
            </div>
            <div class="form-group">
                <label>Employee Email (Login) *</label>
                <input type="email" name="email" value="{{ suggested_email }}" required>
            </div>
            <div class="form-group">
                <label>Employee Password *</label>
                <input type="text" name="emp_password" value="emp123" required>
            </div>
            <div class="form-group">
                <label>Label / Tag</label>
                <input type="text" name="full_name" value="{{ suggested_code }}" required>
            </div>
            <div class="form-group">
                <label>Phone *</label>
                <input type="text" name="phone" placeholder="9876543210" required>
            </div>
            <div class="form-group">
                <label>Gender *</label>
                <select name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>DOB *</label>
                <input type="date" name="dob" required>
            </div>
            <div class="form-group">
                <label>Joining Date *</label>
                <input type="date" name="joining_date" required>
            </div>
            <div class="form-group">
                <label>Department *</label>
                <select name="department" required>
                    <option value="Engineering">Engineering</option>
                    <option value="Product">Product</option>
                    <option value="Human Resources">Human Resources</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>
            <div class="form-group">
                <label>Role *</label>
                <select name="emp_role" required>
                    <option value="Software Engineer">Software Engineer</option>
                    <option value="Senior Software Engineer">Senior Software Engineer</option>
                    <option value="Team Lead">Team Lead</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="HR Executive">HR Executive</option>
                    <option value="HR Manager">HR Manager</option>
                    <option value="Accountant">Accountant</option>
                    <option value="Operations Executive">Operations Executive</option>
                </select>
            </div>
            <div class="form-group">
                <label>Employment Type *</label>
                <select name="employment_type" required>
                    <option value="Full-Time">Full-Time</option>
                    <option value="Contract">Contract</option>
                </select>
            </div>
            <div class="form-group">
                <label>Avatar</label>
                <select name="avatar_url">
                    <option value="/static/images/avatar_emp1.png">Avatar E1</option>
                    <option value="/static/images/avatar_emp2.png">Avatar E2</option>
                    <option value="/static/images/avatar_emp3.png">Avatar E3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Monthly Basic Salary (Rs.) *</label>
                <input type="number" step="0.01" name="basic_salary" placeholder="65000" required>
            </div>
            <div class="form-group">
                <label>HRA (%)</label>
                <input type="number" step="0.1" name="hra_percent" value="20" required>
            </div>
            <div class="form-group">
                <label>Special Allowance (Rs.)</label>
                <input type="number" step="0.01" name="special_allowance" value="4000" required>
            </div>
            <div class="form-group">
                <label>PF Deduction (%)</label>
                <input type="number" step="0.1" name="pf_percent" value="5" required>
            </div>
            <div class="form-group">
                <label>Bank Account</label>
                <input type="text" name="bank_account" placeholder="HDFC0001234">
            </div>
            <div class="form-group">
                <label>Emergency Contact</label>
                <input type="text" name="emergency_contact" placeholder="9876543210">
            </div>
            <div class="form-group">
                <label>Address *</label>
                <input type="text" name="address" value="VVITU Office" required>
            </div>
            <div class="form-group">
                <label>Status *</label>
                <select name="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save VVITU Employee</button>
    </form>
</div>
{% endblock %}
